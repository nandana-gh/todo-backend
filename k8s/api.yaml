apiVersion: v1
kind: Secret
metadata:
  name: api-secret
type: Opaque
stringData:
  connection-string: "Server=todo-mysql;Port=3306;Database=todoapi;User=root;Password=root;"
  JwtSettings__Key: "ThisIsASuperSecretKeyForMyToDoApplication1234567890"
  JwtSettings__Issuer: "ToDoApp"
  JwtSettings__Audience: "ToDoAppUsers"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: <ACR_NAME>.azurecr.io/todo-backend:latest
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: connection-string
            - name: JwtSettings__Key
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JwtSettings__Key
            - name: JwtSettings__Issuer
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JwtSettings__Issuer
            - name: JwtSettings__Audience
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JwtSettings__Audience
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /swagger/index.html
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
spec:
  type: ClusterIP
  selector:
    app: todo-api
  ports:
    - port: 5000
      targetPort: 8080
